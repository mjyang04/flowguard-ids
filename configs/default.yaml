# CLAN reproduction on Lycos2017 — every tunable knob lives here.
# Paper: Wilkie et al., "CLAN: Contrastive Self-Supervised NIDS Using Augmented Negative Pairs", IEEE CSR 2025.
# Reference repo: https://github.com/jackwilkie/CLAN

data:
  data_dir: data/raw
  processed_dir: data/processed
  dataset: lycos2017
  csv_path: data/raw/lycos.csv
  batch_size: 256
  num_workers: 0
  train_ratio: 0.8
  val_ratio: 0.1
  scaler_type: minmax
  benign_label: BENIGN
  random_state: 42

model:
  # CLDNN encoder — CLAN paper default.
  name: cldnn
  input_dim: 78
  embedding_dim: 128
  conv_channels: [64, 128]
  conv_kernel_sizes: [3, 3]
  lstm_hidden_size: 128
  lstm_num_layers: 1
  bidirectional: true
  dropout: 0.2
  l2_normalize: true

loss:
  # Primary contribution of CLAN: augmented samples act as hard negatives.
  # Swap to one of {simclr, barlow_twins, byol, vicreg, simsiam, conflow, sscl_ids}
  # to run a head-to-head SSL baseline comparison.
  name: clan
  margin: 1.0
  temperature: 0.5

augmentation:
  # Strategy used to generate "negative" views of benign flows.
  name: gaussian_noise
  noise_std: 0.1
  feature_dropout_prob: 0.1

training:
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  use_scheduler: true
  scheduler: cosine
  use_early_stopping: true
  early_stopping_patience: 10
  gradient_clip: 1.0
  amp: true
  eval_metric: roc_auc

finetune:
  # Few-shot multiclass fine-tune sweep (per-class sample counts).
  shots_per_class: [8, 16, 32, 64, 128, 256, 512, 1024]
  num_epochs: 20
  learning_rate: 0.001
  head_hidden_dim: 64

runtime:
  output_dir: artifacts
  seed: 42
  device: auto
