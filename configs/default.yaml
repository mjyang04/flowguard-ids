# Minimal CLAN defaults. Dataset-specific profiles only override `data`.

data:
  dataset: lycos2017
  csv_path: data/raw/lycos.csv
  drop_cols: [flow_id, src_addr, src_port, dst_addr, dst_port, ip_prot, timestamp]
  sample_threshold: 100
  test_ratio: 0.5
  split_seed: 39058032
  batch_size: 2048

model:
  neurons: [1024, 1024, 1024, 1024]
  embedding_dim: 64
  residual: true

loss:
  margin: 0.5
  loss_alpha: 0.5

augmentation:
  max_val: 1.7
  p_feature: 0.1

training:
  num_epochs: 200
  learning_rate: 1.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.1
  lr_start: 1.0e-6
  lr_end: 1.0e-6
  amp: true
  print_freq: 50

finetune:
  samples_per_class: [8, 16, 32, 64, 128, 256, 512, 1024]
  num_epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 1.0e-6
  batch_size: 64
  n_sample_seeds: 10

runtime:
  output_dir: artifacts
  seed: 42
  device: auto
